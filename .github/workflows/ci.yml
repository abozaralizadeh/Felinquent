# The same checks as running them locally: types, tests, the forbidden-API check and the build.
# None of them need a Mac, so it runs on Linux.
name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:forbidden
      - run: npm run build
      - run: npm audit --omit=dev
