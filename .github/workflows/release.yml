# Builds the Mac app as one DMG that runs on both Apple Silicon and Intel Macs.
# Started by hand, it keeps the DMG as a build file to try out. Nothing is published.
# Pushing a tag like v0.1.0 also puts the DMG on a GitHub Release as Felinquent.dmg,
# so https://github.com/abozaralizadeh/Felinquent/releases/latest/download/Felinquent.dmg always works.
# Signed ad hoc, with no Apple Developer ID, so the first launch needs "Open Anyway" (see docs/INSTALL.md).
# No secrets: the release uses the workflow's own token.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: npm test
      - run: npm run check:forbidden
      - name: Build the app and the DMG
        run: |
          # The DMG window layout (app on the left, Applications on the right) needs AppleScript,
          # which Tauri skips on CI. Try it, and fall back to a plain DMG if Finder says no.
          TAURI_BUNDLER_DMG_IGNORE_CI=true npm run bundle:mac-universal || npm run bundle:mac-universal
      - name: Check it and name it
        run: |
          B=src-tauri/target/universal-apple-darwin/release/bundle
          codesign --verify --deep --strict --verbose=2 "$B/macos/Felinquent.app"
          lipo -archs "$B/macos/Felinquent.app/Contents/MacOS/felinquent"
          mkdir -p out
          cp "$B"/dmg/*.dmg out/Felinquent.dmg
          cd out && shasum -a 256 Felinquent.dmg | tee Felinquent.dmg.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Felinquent-mac
          path: out/*
          if-no-files-found: error
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/Felinquent.dmg out/Felinquent.dmg.sha256 --title "Felinquent $GITHUB_REF_NAME" --notes-file .github/release-notes.md
