# Builds the Windows installer and keeps it as a downloadable build file.
# The Windows version is untested, so it is not part of a release. The Mac DMG is built by release.yml.
# It only runs when you start it by hand. It does not publish anything or use any secrets.
# The installer is not signed with a Windows certificate.
name: windows installer (untested)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run check:forbidden
      - run: npm run bundle:win
      - uses: actions/upload-artifact@v4
        with:
          name: felinquent-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
